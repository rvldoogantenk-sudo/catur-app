<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catur AI Mobile</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.css">
  <style>
    * { box-sizing: border-box; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; text-align: center; background: #121212; color: #ffffff; margin: 0; padding: 15px; }
    h2 { margin: 5px 0 15px 0; font-size: 20px; }
    .controls { margin-bottom: 15px; }
    select, button { padding: 10px 14px; font-size: 14px; margin: 3px; border-radius: 8px; border: none; font-weight: bold; outline: none; }
    select { background: #2c2c2c; color: #ffffff; border: 1px solid #444; }
    button { background: #28a745; color: white; cursor: pointer; }
    button:active { background: #1e7e34; }
    #board { width: 92vw; max-width: 380px; margin: 0 auto; box-shadow: 0 4px 15px rgba(0,0,0,0.5); border-radius: 4px; overflow: hidden; }
    .status-box { margin-top: 15px; padding: 10px; background: #1e1e1e; border-radius: 8px; border: 1px solid #333; display: inline-block; width: 92vw; max-width: 380px; }
    .status-text { font-size: 15px; font-weight: bold; color: #00e676; }
  </style>
</head>
<body>

  <h2>🎮 Game Catur vs Bot AI</h2>

  <div class="controls">
    <select id="difficulty" onchange="changeDifficulty()">
      <option value="easy">Mudah (Acak)</option>
      <option value="medium" selected>Sedang (Taktis)</option>
      <option value="hard">Sulit (Minimax AI)</option>
    </select>
    <button onclick="resetGame()">Ulang Game</button>
  </div>

  <div id="board"></div>

  <div class="status-box">
    <div class="status-text" id="status">Loading...</div>
  </div>

  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard-js/1.0.0/chessboard-1.0.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

  <script>
    var board = null;
    var game = new Chess();
    var difficulty = 'medium';

    var pieceValues = { p: 10, n: 30, b: 30, r: 50, q: 90, k: 900 };

    function changeDifficulty() {
      difficulty = document.getElementById('difficulty').value;
    }

    function evaluateBoard(boardState) {
      var totalEval = 0;
      for (var i = 0; i < 8; i++) {
        for (var j = 0; j < 8; j++) {
          var piece = boardState[i][j];
          if (piece) {
            var val = pieceValues[piece.type];
            totalEval += (piece.color === 'w' ? -val : val);
          }
        }
      }
      return totalEval;
    }

    function minimax(gameObj, depth, alpha, beta, isMaximizing) {
      if (depth === 0 || gameObj.game_over()) {
        return [evaluateBoard(gameObj.board()), null];
      }

      var moves = gameObj.moves({ verbose: true });
      var bestMove = null;

      if (isMaximizing) {
        var maxEval = -Infinity;
        for (var i = 0; i < moves.length; i++) {
          gameObj.move(moves[i]);
          var evaluation = minimax(gameObj, depth - 1, alpha, beta, false)[0];
          gameObj.undo();
          if (evaluation > maxEval) {
            maxEval = evaluation;
            bestMove = moves[i];
          }
          alpha = Math.max(alpha, evaluation);
          if (beta <= alpha) break;
        }
        return [maxEval, bestMove];
      } else {
        var minEval = Infinity;
        for (var i = 0; i < moves.length; i++) {
          gameObj.move(moves[i]);
          var evaluation = minimax(gameObj, depth - 1, alpha, beta, true)[0];
          gameObj.undo();
          if (evaluation < minEval) {
            minEval = evaluation;
            bestMove = moves[i];
          }
          beta = Math.min(beta, evaluation);
          if (beta <= alpha) break;
        }
        return [minEval, bestMove];
      }
    }

    function makeBotMove() {
      if (game.game_over()) return;

      var moves = game.moves({ verbose: true });
      if (moves.length === 0) return;

      var selectedMove = null;

      if (difficulty === 'easy') {
        selectedMove = moves[Math.floor(Math.random() * moves.length)];
      } else if (difficulty === 'medium') {
        selectedMove = minimax(game, 1, -Infinity, Infinity, true)[1];
      } else if (difficulty === 'hard') {
        selectedMove = minimax(game, 3, -Infinity, Infinity, true)[1];
      }

      if (selectedMove) {
        game.move(selectedMove);
        board.position(game.fen());
        updateStatus();
      }
    }

    function onDragStart(source, piece, position, orientation) {
      if (game.game_over()) return false;
      if (game.turn() === 'b' || piece.search(/^b/) !== -1) {
        return false;
      }
    }

    function onDrop(source, target) {
      var move = game.move({
        from: source,
        to: target,
        promotion: 'q'
      });

      if (move === null) return 'snapback';

      updateStatus();
      window.setTimeout(makeBotMove, 250);
    }

    function onSnapEnd() {
      board.position(game.fen());
    }

    function updateStatus() {
      var statusEl = document.getElementById('status');
      var moveColor = game.turn() === 'b' ? 'Bot Hitam (Berpikir...)' : 'Putih (Kamu)';

      if (game.in_checkmate()) {
        statusEl.innerText = 'Game Over! ' + (game.turn() === 'b' ? 'Kamu Menang 🎉' : 'Bot Menang 🤖');
        statusEl.style.color = '#ff5252';
      } else if (game.in_draw()) {
        statusEl.innerText = 'Game Over! Hasil Remis (Draw)';
        statusEl.style.color = '#ffb74d';
      } else {
        var txt = 'Giliran: ' + moveColor;
        if (game.in_check()) txt += ' ⚠️ (SKAK!)';
        statusEl.innerText = txt;
        statusEl.style.color = '#00e676';
      }
    }

    function resetGame() {
      game.reset();
      board.start();
      updateStatus();
    }

    function pieceTheme (piece) {
      var cdnUrl = 'https://commons.wikimedia.org/wiki/Special:FilePath/';
      var mapping = {
        'wP': 'Chess_plt45.svg', 'wR': 'Chess_rlt45.svg', 'wN': 'Chess_nlt45.svg',
        'wB': 'Chess_blt45.svg', 'wQ': 'Chess_qlt45.svg', 'wK': 'Chess_klt45.svg',
        'bP': 'Chess_pdt45.svg', 'bR': 'Chess_rdt45.svg', 'bN': 'Chess_ndt45.svg',
        'bB': 'Chess_bdt45.svg', 'bQ': 'Chess_qdt45.svg', 'bK': 'Chess_kdt45.svg'
      };
      return cdnUrl + mapping[piece];
    }

    board = Chessboard('board', {
      draggable: true,
      position: 'start',
      pieceTheme: pieceTheme,
      onDragStart: onDragStart,
      onDrop: onDrop,
      onSnapEnd: onSnapEnd
    });

    updateStatus();
  </script>
</body>
</html>
