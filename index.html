<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Catur AI</title>
  <link rel="stylesheet" href="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.css">
  <style>
    body { font-family: Arial, sans-serif; text-align: center; background: #222; color: white; margin: 0; padding: 20px; }
    #board { width: 90vw; max-width: 400px; margin: 20px auto; }
    select, button { padding: 10px 15px; font-size: 16px; margin: 5px; border-radius: 5px; border: none; cursor: pointer; }
    .status { font-weight: bold; margin-top: 10px; }
  </style>
</head>
<body>

  <h2>🎮 Game Catur vs Bot AI</h2>

  <label for="difficulty">Pilih Tingkat Kesulitan:</label>
  <select id="difficulty" onchange="changeDifficulty()">
    <option value="easy">Mudah (Acak)</option>
    <option value="medium" selected>Sedang (Evaluasi Posisi)</option>
    <option value="hard">Sulit (Minimax Depth 3)</option>
  </select>
  <br>
  <button onclick="resetGame()">Ulang Game</button>

  <div id="board"></div>
  <div class="status" id="status">Giliran Putih (Kamu)</div>

  <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>

  <script>
    var board = null;
    var game = new Chess();
    var difficulty = 'medium';

    var pieceValues = { p: 10, n: 30, b: 30, r: 50, q: 90, k: 900 };

    function changeDifficulty() {
      difficulty = document.getElementById('difficulty').value;
    }

    function evaluateBoard(boardState) {
      var totalEvaluation = 0;
      boardState.forEach(function (row) {
        row.forEach(function (piece) {
          if (piece) {
            var val = pieceValues[piece.type];
            totalEvaluation += (piece.color === 'w' ? -val : val);
          }
        });
      });
      return totalEvaluation;
    }

    function minimax(gameObj, depth, isMaximizing) {
      if (depth === 0 || gameObj.game_over()) {
        return [evaluateBoard(gameObj.board()), null];
      }

      var moves = gameObj.moves({ verbose: true });
      var bestMove = null;

      if (isMaximizing) {
        var maxEval = -Infinity;
        for (var i = 0; i < moves.length; i++) {
          gameObj.move(moves[i]);
          var evaluation = minimax(gameObj, depth - 1, false)[0];
          gameObj.undo();
          if (evaluation > maxEval) {
            maxEval = evaluation;
            bestMove = moves[i];
          }
        }
        return [maxEval, bestMove];
      } else {
        var minEval = Infinity;
        for (var i = 0; i < moves.length; i++) {
          gameObj.move(moves[i]);
          var evaluation = minimax(gameObj, depth - 1, true)[0];
          gameObj.undo();
          if (evaluation < minEval) {
            minEval = evaluation;
            bestMove = moves[i];
          }
        }
        return [minEval, bestMove];
      }
    }

    function makeBotMove() {
      if (game.game_over()) return;

      var moves = game.moves({ verbose: true });
      if (moves.length === 0) return;

      var selectedMove = null;

      if (difficulty === 'easy') {
        // Mode Mudah: Pilih gerakan secara acak
        selectedMove = moves[Math.floor(Math.random() * moves.length)];
      } else if (difficulty === 'medium') {
        // Mode Sedang: Minimax Depth 1
        selectedMove = minimax(game, 1, true)[1];
      } else if (difficulty === 'hard') {
        // Mode Sulit: Minimax Depth 3
        selectedMove = minimax(game, 3, true)[1];
      }

      if (selectedMove) {
        game.move(selectedMove);
        board.position(game.fen());
        updateStatus();
      }
    }

    function onDragStart(source, piece, position, orientation) {
      if (game.game_over() || piece.search(/^b/) !== -1) return false;
    }

    function onDrop(source, target) {
      var move = game.move({
        from: source,
        to: target,
        promotion: 'q'
      });

      if (move === null) return 'snapback';

      updateStatus();
      window.setTimeout(makeBotMove, 250);
    }

    function onSnapEnd() {
      board.position(game.fen());
    }

    function updateStatus() {
      var status = '';
      var moveColor = game.turn() === 'b' ? 'Hitam (Bot Thinking...)' : 'Putih (Kamu)';

      if (game.in_checkmate()) {
        status = 'Game Over, ' + moveColor + ' Skakmat!';
      } else if (game.in_draw()) {
        status = 'Game Over, Remis (Draw)';
      } else {
        status = 'Giliran: ' + moveColor;
        if (game.in_check()) status += ', (Dalam Kondisi Skak!)';
      }
      document.getElementById('status').innerText = status;
    }

    function resetGame() {
      game.reset();
      board.start();
      updateStatus();
    }

    board = Chessboard('board', {
      draggable: true,
      position: 'start',
      onDragStart: onDragStart,
      onDrop: onDrop,
      onSnapEnd: onSnapEnd
    });

    updateStatus();
  </script>
</body>
</html>
